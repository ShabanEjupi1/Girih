name: girih
description: "Girih — lidh nyjet, zbulo yllin. Lojë enigmash me 240 nivele, pa rrjet dhe pa reklama."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  # E vetmja varësi. Ruajtja e përparimit është gjëja e vetme që loja nuk e bën
  # dot vetë njësoj në shfletues dhe në Android; gjithçka tjetër — grafika,
  # nivelet, animacionet — vizatohet ose llogaritet nga vetë kodi.
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
