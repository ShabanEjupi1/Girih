name: girih
description: "Girih — lidh nyjet, zbulo yllin. Lojë enigmash me 300 nivele që luhen pa internet."
publish_to: 'none'
version: 1.2.1+4

environment:
  sdk: ^3.10.0

dependencies:
  firebase_core: ^3.6.0
  firebase_analytics: ^11.3.0
  flutter:
    sdk: flutter
  # Ruajtja e përparimit është gjëja e vetme që loja nuk e bën dot vetë njësoj
  # në shfletues dhe në Android; gjithçka tjetër — grafika, nivelet,
  # animacionet — vizatohet ose llogaritet nga vetë kodi.
  shared_preferences: ^2.3.0
  # 🚨 E VETMJA gjë në krejt lojën që prek internetin (nga 1.2.0). Nivelet,
  # përparimi dhe ndihmat mbetën vendëse; pa rrjet loja luhet e plotë, thjesht
  # pa reklama. Kjo varësi solli edhe lejen `INTERNET` edhe lejen `AD_ID` te
  # manifesti i bashkuar — shih `android/app/src/main/AndroidManifest.xml`.
  google_mobile_ads: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
