services:
  girih:
    image: nginx:alpine
    container_name: girih
    restart: always
    # Vetëm te loopback-u: jashtë del përmes tunelit `ampere`, kurrë drejtpërdrejt.
    ports:
      - "127.0.0.1:8220:8080"
    volumes:
      # Dalja e `flutter build web`. Te /mnt/data dhe jo te disku i nisjes.
      - /mnt/data/girih-web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 128m
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }
