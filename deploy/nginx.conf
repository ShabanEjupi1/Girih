server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Pa këto Chrome-i e refuzon `.wasm`-in me MIME të gabuar dhe loja hapet me
    # ekran të bardhë pa asnjë gabim të dukshëm te faqja.
    types {
        application/wasm  wasm;
        application/javascript  js mjs;
        application/json  json map;
        image/svg+xml  svg;
        image/png  png;
        font/woff2  woff2;
        text/html  html;
    }
    default_type application/octet-stream;

    gzip on;
    gzip_types application/javascript application/json application/wasm text/css image/svg+xml;
    gzip_min_length 1024;

    # 🚨 `flutter_bootstrap.js` dhe `main.dart.js` NUK kanë hash te emri, ndaj një
    # `max-age` mbi to do të thoshte se pas çdo vendosjeje lojtari mbetet me kodin
    # e vjetër. Cloudflare-i i kësaj zone e mbishkruan `no-cache` me `max-age`,
    # prandaj vjen edhe `must-revalidate`.
    location ~* \.(js|json|html)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
